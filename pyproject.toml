[project]
name = "jevqa"
version = "0.1.0"
description = "R&D: Jev (TypeSafe System One) as a Bible translation checker"
authors = [
    { name = "Benjamin", email = "703973+deferredreward@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
jevqa = "jevqa:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
